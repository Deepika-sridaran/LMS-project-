        <main>
            <h1>Assignment: Build a Calculator</h1>
            <p><strong>Course:</strong> Introduction to Python</p>
            <p><strong>Deadline:</strong> 20 sept 2026, 11.59 PM</p>
            <p><strong>Max Marks:</strong> 100</p>
            <p><a href="#">Download Assignment Instructions</a></p>

            <form id="assignment-form">
                <div class="form-group">
                    <label for="submission-file">Upload Your Submission</label>
                    <input type="file" id="submission-file" name="submission-file"
                     accept=".pdf,.doc,.docx,.zip,.py" required>
                </div>
                <div class="form-group">
                    <label for="submission-comments">Comments (Optional)</label>
                    <textarea id="submission-comments" rows="3"></textarea>
                </div>
                <button type="submit">Submit Assignment</button>
            </form>
            <p id="submission-message"></p>
        </main>
        <script src="script.js"></script>
