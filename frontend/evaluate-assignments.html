<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Evaluate Assignments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>LMS Trainer</h2>
        <ul>
            <li><a href="trainer-dashboard.html">Dashboard</a></li>
            <li><a href="create-course.html">Create Course</a></li>
            <li><a href="my-students.html">My Students</a></li>
            <li><a href="evaluate-assignments.html">Evaluate</a></li>
        </ul>
    </nav>

    <main>
        <h1>Evaluate Assignments</h1>

        <div class="evaluation-item">
            <h3>Meena Raj — "Build a Calculator" (Introduction to Python)</h3>
            <p><a href="#">Download Submission</a></p>

            <div class="form-group">
                <label for="marks-1">Marks (out of 100)</label>
                <input type="number" id="marks-1" min="0" max="100">
            </div>

            <div class="form-group">
                <label for="feedback-1">Feedback</label>
                <textarea id="feedback-1" rows="2"></textarea>
            </div>

            <button class="eval-submit-btn" data-student="Meena Raj">Submit Evaluation</button>
        </div>

        <div class="evaluation-item">
            <h3>Suresh Babu — "Build a Calculator" (Introduction to Python)</h3>
            <p><a href="#">Download Submission</a></p>

            <div class="form-group">
                <label for="marks-2">Marks (out of 100)</label>
                <input type="number" id="marks-2" min="0" max="100">
            </div>

            <div class="form-group">
                <label for="feedback-2">Feedback</label>
                <textarea id="feedback-2" rows="2"></textarea>
            </div>

            <button class="eval-submit-btn" data-student="Suresh Babu">Submit Evaluation</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
